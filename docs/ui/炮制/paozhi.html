<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>炮制 · 中医药物炮制</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ── Design tokens — 古朴 only ────────────────────────── */
  :root {
    --bg-1: #e8dcc4;
    --bg-2: #d6c098;
    --bg-3: #b89970;
    --paper: #f4e9d2;
    --paper-warm: #ecdfc0;
    --paper-dark: #d9c69a;
    --paper-edge: #b89870;
    --ink: #2b1f15;
    --ink-soft: #4a3a28;
    --ink-faint: #6b5942;
    --vermilion: #b9341c;
    --vermilion-deep: #8b2412;
    --persimmon: #d97842;
    --jade: #4a6b4d;
    --jade-deep: #2f4730;
    --gold: #b8893a;
    --gold-soft: #d9b56a;
    --bronze: #6e4a22;
    --bronze-deep: #3a2010;
    --shadow: rgba(40, 25, 10, .25);
    --frame: rgba(60, 40, 20, .35);
    --frame-soft: rgba(60, 40, 20, .18);
    --noise-op: .5;
    --vignette: rgba(40, 25, 10, .42);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Noto Serif SC", "ZCOOL XiaoWei", serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 30% 15%, rgba(244,233,210,.7) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 90%, rgba(110,74,34,.15) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* paper grain via SVG noise */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.13  0 0 0 0 0.08  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
    opacity: var(--noise-op);
    mix-blend-mode: multiply;
    z-index: 1;
  }
  /* vignette */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, var(--vignette) 100%);
    z-index: 2;
  }

  #root { position: relative; z-index: 3; height: 100%; }

  /* fonts */
  .f-han { font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", "Noto Serif SC", serif; font-weight: 400; letter-spacing: .04em; }
  .f-seal { font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif; letter-spacing: .12em; }
  .f-body { font-family: "Noto Serif SC", serif; }
  .f-ui { font-family: "Noto Sans SC", "Noto Serif SC", sans-serif; }

  /* prevent dragging native images */
  img { -webkit-user-drag: none; user-drag: none; }

  /* scrollbar inside dark scroll */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body data-theme="ancient">
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/atoms.jsx"></script>
  <script type="text/babel" src="src/scroll.jsx"></script>
  <script type="text/babel" src="src/vessels.jsx"></script>
  <script type="text/babel" src="src/animations.jsx"></script>
  <script type="text/babel" src="src/inventory.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
